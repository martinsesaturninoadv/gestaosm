<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão do Escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1B3A5C;--brand2:#2E6DA4;--accent:#C8A84B;--accent2:#E3C66E;--sidebar:#0F2942;
  --bg:#F3F4F6;--card:#FFFFFF;--hover:#F7F8FA;--text:#1A1A1A;--text2:#555;--text3:#888;
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.15);
  --green:#2E7D4E;--green-l:#E4F5EB;--red:#B93434;--red-l:#FBEAEA;--amber:#A8630E;--amber-l:#FEF3E0;
  --blue:#1E5FA8;--blue-l:#E5EEFB;--gray:#666;--gray-l:#F0F0ED;--teal:#1A7A6E;--teal-l:#E0F5F2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1520;--card:#142030;--hover:#1A293B;--text:#E7ECF2;--text2:#B6C0CC;--text3:#7F8B99;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --green:#5CC48A;--green-l:#173627;--red:#F07A7A;--red-l:#3B1D1F;--amber:#E9A94A;--amber-l:#3A2A12;
  --blue:#7FB0F0;--blue-l:#17294A;--gray:#A5AFBB;--gray-l:#1E2B3B;--teal:#5FCDBE;--teal-l:#123430;--brand2:#5B93CF;
}}
:root[data-theme="dark"]{
  --bg:#0D1520;--card:#142030;--hover:#1A293B;--text:#E7ECF2;--text2:#B6C0CC;--text3:#7F8B99;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --green:#5CC48A;--green-l:#173627;--red:#F07A7A;--red-l:#3B1D1F;--amber:#E9A94A;--amber-l:#3A2A12;
  --blue:#7FB0F0;--blue-l:#17294A;--gray:#A5AFBB;--gray-l:#1E2B3B;--teal:#5FCDBE;--teal-l:#123430;--brand2:#5B93CF;
}
html,body{min-height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.45}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:-1px}
textarea{resize:vertical}
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:236px;background:var(--sidebar);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0;z-index:60}
.brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#2E6DA4);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.b1{font-size:12.5px;font-weight:700;line-height:1.2}
.b2{font-size:10.5px;color:rgba(200,168,75,.85)}
nav{flex:1;overflow-y:auto;padding:8px 0}
.ns{padding:12px 16px 4px;font-size:9.5px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase}
.ni{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:12.5px;color:rgba(255,255,255,.62);border-left:2px solid transparent;text-decoration:none}
.ni:hover{color:#fff;background:rgba(255,255,255,.06)}
.ni.active{color:#fff;background:rgba(200,168,75,.14);border-left-color:var(--accent)}
.ni .ic{width:16px;text-align:center;opacity:.9}
.nb{margin-left:auto;background:#C84B6E;color:#fff;border-radius:10px;padding:0 6px;font-size:10px;font-weight:700;line-height:16px}
.nb:empty{display:none}
.suser{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:9px;font-size:11.5px;color:rgba(255,255,255,.75)}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.suser select{background:transparent;border:none;color:#fff;padding:0;font-size:11.5px;width:100%}
.suser select option{color:#000}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 20px}
.ptitle{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;background:none;border:1px solid var(--border2);color:var(--text);border-radius:8px;width:34px;height:34px;font-size:16px}
.search{position:relative;margin-left:auto;width:280px}
.search input{width:100%;padding-left:30px}
.search::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px}
.sres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--border2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:360px;overflow:auto;display:none}
.sres.open{display:block}
.sres a{display:block;padding:8px 12px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--border)}
.sres a:hover{background:var(--hover)}
.sres small{color:var(--text3);display:block;font-size:11px}
.content{padding:20px;width:100%;max-width:1440px}

/* COMPONENTES */
.grid{display:grid;gap:14px;margin-bottom:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.card h3{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--text3);font-size:11px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:600}
.kpi .v{white-space:nowrap;font-size:21px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--text3)}
.kpi .s.bad{color:var(--red)} .kpi .s.good{color:var(--green)}
.btn{border:1px solid transparent;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;white-space:nowrap;transition:background .15s}
.btn-brand{background:var(--brand);color:#fff}.btn-brand:hover{background:#2E6DA4}
.btn-gold{background:var(--accent);color:#13273D}.btn-gold:hover{background:var(--accent2)}
.btn-ghost{background:transparent;border-color:var(--border2);color:var(--text2)}.btn-ghost:hover{background:var(--hover)}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn-sm{padding:4px 10px;font-size:11px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.p-green{background:var(--green-l);color:var(--green)}.p-red{background:var(--red-l);color:var(--red)}
.p-amber{background:var(--amber-l);color:var(--amber)}.p-blue{background:var(--blue-l);color:var(--blue)}
.p-gray{background:var(--gray-l);color:var(--gray)}.p-teal{background:var(--teal-l);color:var(--teal)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr[data-go],tr[data-act]{cursor:pointer}
tr[data-go]:hover td,tr[data-act]:hover td{background:var(--hover)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--text3)} .small{font-size:11px}
.strong{font-weight:600}
.empty{color:var(--text3);font-size:12px;padding:10px 0;text-align:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border2);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 14px;border:none;background:none;color:var(--text2);font-weight:600;font-size:12px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:12.5px}
.dl dt{color:var(--text3)}
.hint{font-size:11.5px;color:var(--text2);background:var(--blue-l);padding:8px 12px;border-radius:8px;margin-bottom:12px}

/* LISTA DE EVENTOS */
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)}
.ev:last-child{border-bottom:none}
.ev input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--green)}
.ev .body{flex:1;min-width:0;cursor:pointer}
.ev .t{font-weight:600}
.ev.done .t{text-decoration:line-through;color:var(--text3)}
.dgroup{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 2px}
.dgroup:first-child{margin-top:0}

/* KANBAN */
.kanban{display:grid;gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--gray-l);border-radius:12px;padding:10px;min-height:200px;min-width:220px}
.kcol.over{outline:2px dashed var(--brand2)}
.kcol-h{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:8px;cursor:grab}
.kcard:hover{box-shadow:0 3px 10px rgba(0,0,0,.1)}
.kcard .t{font-weight:600;margin-bottom:4px}
.kcard .meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px;color:var(--text3)}
.kmove{display:flex;justify-content:space-between;margin-top:6px}
.kmove button{border:none;background:none;color:var(--text3);font-size:12px;padding:0 4px}
.kmove button:hover{color:var(--text)}

/* CALENDÁRIO */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border2);border:1px solid var(--border2);border-radius:10px;overflow:hidden}
.cal>div{background:var(--card);min-height:96px;padding:5px;font-size:11px;min-width:0}
.cal .hd{min-height:auto;text-align:center;font-weight:700;color:var(--text3);font-size:10.5px;text-transform:uppercase;padding:6px}
.cal .out{background:var(--bg)}
.cal .dn{font-weight:700;color:var(--text2);margin-bottom:3px;cursor:pointer}
.cal .today .dn{background:var(--accent);color:#13273D;border-radius:10px;padding:0 6px;display:inline-block}
.cal .ce{display:block;border-radius:4px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

/* GRÁFICOS */
.vbars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:10px}
.vg{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vgb{display:flex;gap:3px;align-items:flex-end;height:150px}
.vb{width:14px;border-radius:4px 4px 0 0;min-height:2px}
.vg .lb{font-size:10.5px;color:var(--text3)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--text2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;margin-bottom:8px;font-size:12px}
.hb .tr{background:var(--gray-l);height:10px;border-radius:5px;overflow:hidden}
.hb .fl{height:100%;background:var(--brand2);border-radius:5px}
.hb .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* TIMELINE */
.tl{padding-left:4px}
.tli{border-left:2px solid var(--border2);padding:0 0 14px 14px;position:relative}
.tli::before{content:'';position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--brand2)}
.tli:last-child{padding-bottom:0}
.tli .d{font-size:11px;color:var(--text3)}

/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100}
.mbg.open{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:15px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px}
.fgrid select,.fgrid input:not([type=checkbox]),.fgrid textarea{width:100%}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--text2)}
.fgrid label.chk{flex-direction:row;align-items:center;gap:8px;font-size:12px}
.fgrid .err{border-color:var(--red)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mfoot .left{margin-right:auto}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa button{text-align:left;padding:12px;border:1px solid var(--border2);border-radius:10px;background:var(--card);color:var(--text)}
.qa button:hover{background:var(--hover)}
.qa small{display:block;color:var(--text3);font-size:11px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--brand);color:#fff;padding:10px 16px;border-radius:9px;font-size:12.5px;font-weight:600;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:none}
.scrim{display:none}

@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .menu-btn{display:inline-block}
  .topbar{padding:8px 16px;flex-wrap:wrap}
  .search{order:3;width:100%;margin-left:0}
  .content{padding:16px}
  .fgrid,.qa{grid-template-columns:1fr}
  .dl{grid-template-columns:110px 1fr}
  .cal>div{min-height:58px;padding:3px}
  .cal .ce{font-size:0;height:6px;padding:0}
  .hide-m{display:none}
}
@media print{.sidebar,.topbar,.toolbar{display:none}.card{border:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">MS</div>
      <div><div class="b1" id="brand-nome">Martins &amp; Saturnino</div><div class="b2">Gestão do escritório</div></div>
    </div>
    <nav id="nav">
      <div class="ns">Principal</div>
      <a class="ni" href="#painel"><span class="ic">◼</span>Painel</a>
      <a class="ni" href="#agenda"><span class="ic">◷</span>Agenda e prazos<span class="nb" id="nb-agenda"></span></a>
      <a class="ni" href="#tarefas"><span class="ic">☑</span>Tarefas<span class="nb" id="nb-tarefas"></span></a>
      <div class="ns">Jurídico</div>
      <a class="ni" href="#clientes"><span class="ic">◉</span>Clientes</a>
      <a class="ni" href="#processos"><span class="ic">▣</span>Processos</a>
      <a class="ni" href="#documentos"><span class="ic">▤</span>Documentos e modelos<span class="nb" id="nb-docs"></span></a>
      <div class="ns">Comercial</div>
      <a class="ni" href="#atendimentos"><span class="ic">◈</span>Atendimentos (CRM)</a>
      <div class="ns">Gestão</div>
      <a class="ni" href="#financeiro"><span class="ic">$</span>Financeiro<span class="nb" id="nb-fin"></span></a>
      <a class="ni" href="#relatorios"><span class="ic">▲</span>Relatórios</a>
      <a class="ni" href="#config"><span class="ic">⚙</span>Configurações</a>
    </nav>
    <div class="suser"><div class="av" id="u-av">AM</div><select id="u-sel" aria-label="Usuário atual"></select></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
      <div class="ptitle" id="ptitle">Painel</div>
      <div class="search">
        <input id="q" placeholder="Buscar cliente, processo, CPF…" autocomplete="off">
        <div class="sres" id="sres"></div>
      </div>
      <button class="btn btn-gold" data-act="quickAdd">+ Novo</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="mbg" id="mbg"><div class="modal" role="dialog" aria-modal="true"><h2 id="m-title"></h2><div id="m-body"></div><div class="mfoot" id="m-foot"></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-import" accept="application/json" hidden>

<script>
/* =========================================================
   CONSTANTES
   ========================================================= */
const KEY='msadv_gestao_v4';
const AREAS=['Previdenciário','Trabalhista','Cível','Família','Consumidor','Tributário','Empresarial','Criminal'];
const FASES=['Inicial / Distribuição','Citação','Instrução','Sentença','Recurso','Cumprimento de sentença','Administrativo — análise','Administrativo — exigência','Encerrado'];
const STATUS_PROC=['Em andamento','Suspenso','Ganho','Acordo','Perdido','Arquivado'];
const EVT_TIPOS=['Prazo','Audiência','Perícia','Reunião','Exigência INSS','Outro'];
const CAT_REC=['Honorários contratuais','Honorários de êxito','Honorários mensais (partido)','Sucumbência','Consulta','Reembolso de custas','Outras receitas'];
const CAT_DESP=['Aluguel e condomínio','Folha / pró-labore','Software e sistemas','Marketing / tráfego pago','Custas processuais','Impostos','Material e escritório','Outras despesas'];
const FORMAS=['PIX','Boleto','Cartão','Transferência','Dinheiro'];
const ETAPAS=['Novo contato','Em atendimento','Proposta enviada','Fechado','Perdido'];
const ORIGENS=['Indicação','Instagram','Google','Meta Ads','Site','Outro'];
const PRIOR=['Alta','Média','Baixa'];
const TSTATUS=[['todo','A fazer'],['doing','Em andamento'],['done','Concluído']];
const TITLES={painel:'Painel',agenda:'Agenda e prazos',tarefas:'Tarefas',clientes:'Clientes',cliente:'Cliente',processos:'Processos',processo:'Processo',documentos:'Documentos e modelos',atendimentos:'Atendimentos (CRM)',financeiro:'Financeiro',relatorios:'Relatórios',config:'Configurações'};

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlK=v=>Math.abs(v)>=1000?(v<0?'−':'')+'R$ '+(Math.abs(v)/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':brl(v);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};
const today=()=>iso(new Date());
const addDays=(n,base)=>{const d=base?new Date(base+'T00:00'):new Date();d.setDate(d.getDate()+n);return iso(d);};
const addMonths=(s,n)=>{const d=new Date(s+'T00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d);};
const monthDate=(off,day)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d);};
const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('pt-BR'):'—';
const fdw=s=>s?new Date(s+'T00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}):'—';
const diff=s=>Math.round((new Date(s+'T00:00')-new Date(today()+'T00:00'))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mLabel=ym=>{const[y,m]=ym.split('-');return MESES[+m-1]+'/'+y.slice(2);};

function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.style.background=bad?'var(--red)':'var(--brand)';t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);}
function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* =========================================================

   ========================================================= */
function normOpts(o){return (typeof o==='function'?o():o).map(x=>Array.isArray(x)?x:[x,x]);}
function closeModal(){$('#mbg').classList.remove('open');}
function modal(title,html,buttons){
  $('#m-title').textContent=title;$('#m-body').innerHTML=html;
  const foot=$('#m-foot');foot.innerHTML='';
  (buttons||[{l:'Fechar',c:'btn-ghost',fn:closeModal}]).forEach(b=>{const el=document.createElement('button');el.className='btn '+b.c+(b.left?' left':'');el.textContent=b.l;el.onclick=b.fn;foot.appendChild(el);});
  $('#mbg').classList.add('open');
  const first=$('#m-body input,#m-body select,#m-body textarea');if(first)setTimeout(()=>first.focus(),30);
}
function form(title,fields,data,onSave,onDelete){
  const html='<div class="fgrid">'+fields.map(f=>{
    const v=data[f.k]??f.d??'';const id='f_'+f.k;const cls=f.full?' class="full"':'';
    let inp;
    if(f.t==='select')inp=`<select id="${id}">${f.req?'':'<option value="">—</option>'}${normOpts(f.o).map(([ov,ol])=>`<option value="${esc(ov)}"${String(ov)===String(v)?' selected':''}>${esc(ol)}</option>`).join('')}</select>`;
    else if(f.t==='textarea')inp=`<textarea id="${id}" rows="${f.rows||3}">${esc(v)}</textarea>`;
    else if(f.t==='check')return `<label class="chk${f.full?' full':''}"><input type="checkbox" id="${id}"${v?' checked':''}> ${esc(f.l)}</label>`;
    else inp=`<input id="${id}" type="${f.t||'text'}" value="${esc(v)}"${f.t==='number'?' step="0.01" min="0"':''}${f.ph?` placeholder="${esc(f.ph)}"`:''}>`;
    return `<label${cls}>${esc(f.l)}${f.req?' *':''}${inp}</label>`;
  }).join('')+'</div>';
  const btns=[];
  if(onDelete)btns.push({l:'Excluir',c:'btn-danger',left:1,fn:()=>{if(confirm('Excluir este registro?')){onDelete();closeModal();save();render();toast('Excluído');}}});
  btns.push({l:'Cancelar',c:'btn-ghost',fn:closeModal});
  btns.push({l:'Salvar',c:'btn-brand',fn:()=>{
    const out={};let ok=true;
    fields.forEach(f=>{const el=$('#f_'+f.k);let v=f.t==='check'?el.checked:f.t==='number'?(parseFloat(el.value)||0):el.value.trim();
      el.classList.remove('err');if(f.req&&(v===''||v===null)){el.classList.add('err');ok=false;}out[f.k]=v;});
    if(!ok){toast('Preencha os campos obrigatórios',1);return;}
    if(onSave(out)===false)return;
    closeModal();save();render();toast('Salvo ✓');
  }});
  modal(title,html,btns);
}
function upsert(coll,id,vals,base){
  if(id){Object.assign(db[coll].find(x=>x.id===id),vals);return id;}
  const n={...base,...vals,id:uid()};db[coll].push(n);return n.id;
}

const pill=(t,c)=>`<span class="pill ${c}">${esc(t)}</span>`;
const pStatusLanc=s=>pill(s,s==='Pago'?'p-green':s==='Atrasado'?'p-red':'p-amber');
const pStatusProc=s=>pill(s,s==='Em andamento'?'p-blue':s==='Ganho'||s==='Acordo'?'p-green':s==='Perdido'?'p-red':'p-gray');
const pPrior=p=>pill(p,p==='Alta'?'p-red':p==='Média'?'p-amber':'p-gray');
const pTipoEvt=t=>pill(t,t==='Prazo'?'p-red':t==='Audiência'?'p-blue':t==='Perícia'?'p-teal':t==='Exigência INSS'?'p-amber':'p-gray');
function prazoTxt(d){const n=diff(d);if(n<0)return `<span style="color:var(--red);font-weight:600">vencido há ${-n} dia${n===-1?'':'s'}</span>`;if(n===0)return '<span style="color:var(--red);font-weight:600">hoje</span>';if(n===1)return '<span style="color:var(--amber);font-weight:600">amanhã</span>';return `<span class="${n<=5?'strong':'muted'}" style="${n<=5?'color:var(--amber)':''}">em ${n} dias</span>`;}
function kpi(l,v,s,cls){return `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s ${cls||''}">${s||'&nbsp;'}</div></div>`;}
function hbars(items,fmt){const max=Math.max(1,...items.map(i=>i[1]));if(!items.length)return '<div class="empty">Sem dados</div>';
  return items.map(([l,v,c])=>`<div class="hb"><div class="lb" title="${esc(l)}">${esc(l)}</div><div class="tr"><div class="fl" style="width:${(v/max*100).toFixed(1)}%;${c?'background:'+c:''}"></div></div><div class="num small">${fmt?fmt(v):v}</div></div>`).join('');}
function evItem(e,showProc=true){
  const p=proc(e.processoId);
  return `<div class="ev${e.feito?' done':''}"><input type="checkbox" data-act="toggleEv" data-id="${e.id}"${e.feito?' checked':''} aria-label="Marcar como cumprido">
    <div class="body" data-act="editEv" data-id="${e.id}"><div class="t">${esc(e.titulo)}</div>
    <div class="small muted">${pTipoEvt(e.tipo)} ${e.hora?esc(e.hora)+' · ':''}${showProc&&p?esc(p.numero)+' · ':''}${esc(nomeCli(e.clienteId))} · ${esc(nomeUsr(e.responsavelId))}</div></div>
    <div class="small" style="text-align:right;white-space:nowrap">${fd(e.data)}<br>${e.feito?'<span class="muted">cumprido</span>':prazoTxt(e.data)}</div></div>`;
}
function fluxo6(){
  const out=[];for(let m=-5;m<=0;m++){const ym=monthDate(m,1).slice(0,7);
    const r=db.lancamentos.filter(l=>l.tipo==='receita'&&l.pago&&(l.pagoEm||l.venc).startsWith(ym)).reduce((s,l)=>s+l.valor,0);
    const d=db.lancamentos.filter(l=>l.tipo==='despesa'&&l.pago&&(l.pagoEm||l.venc).startsWith(ym)).reduce((s,l)=>s+l.valor,0);
    out.push({ym,r,d});}
  const max=Math.max(1,...out.flatMap(o=>[o.r,o.d]));
  return `<div class="vbars">${out.map(o=>`<div class="vg" title="${mLabel(o.ym)} — Receitas ${brl(o.r)} · Despesas ${brl(o.d)} · Resultado ${brl(o.r-o.d)}">
    <div class="vgb"><div class="vb" style="height:${o.r/max*150}px;background:var(--green)"></div><div class="vb" style="height:${o.d/max*150}px;background:var(--red);opacity:.75"></div></div>
    <div class="lb">${mLabel(o.ym)}</div><div class="small ${o.r-o.d>=0?'':'bad'}" style="font-weight:600;color:${o.r-o.d>=0?'var(--green)':'var(--red)'}">${brlK(o.r-o.d)}</div></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>Receitas recebidas</span><span><i style="background:var(--red);opacity:.75"></i>Despesas pagas</span><span>Valor abaixo = resultado do mês</span></div>`;
}

V.agenda=()=>{
  const f=ui.f.agenda||(ui.f.agenda={resp:'',tipo:'',feitos:false});
  const head=`<div class="toolbar">
    <div class="tabs" style="margin:0;border:none"><button class="tab ${ui.agendaView==='lista'?'active':''}" data-act="agView" data-id="lista">Lista</button><button class="tab ${ui.agendaView==='mes'?'active':''}" data-act="agView" data-id="mes">Mês</button></div>
    <select data-f="agenda.resp"><option value="">Todos os responsáveis</option>${db.usuarios.map(u=>`<option value="${u.id}"${f.resp===u.id?' selected':''}>${esc(u.nome)}</option>`).join('')}</select>
    <select data-f="agenda.tipo"><option value="">Todos os tipos</option>${EVT_TIPOS.map(t=>`<option${f.tipo===t?' selected':''}>${t}</option>`).join('')}</select>
    <label class="small"><input type="checkbox" data-f="agenda.feitos"${f.feitos?' checked':''}> mostrar cumpridos</label>
    <span class="grow"></span><button class="btn btn-gold" data-act="novoEv">+ Prazo / compromisso</button></div>`;
  let evs=db.eventos.filter(e=>(!f.resp||e.responsavelId===f.resp)&&(!f.tipo||e.tipo===f.tipo));
  if(ui.agendaView==='mes'){
    const [y,m]=ui.agendaMes.split('-').map(Number);const first=new Date(y,m-1,1);const start=first.getDay();const days=new Date(y,m,0).getDate();
    let cells=['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div class="hd">${d}</div>`).join('');
    for(let i=0;i<start;i++)cells+='<div class="out"></div>';
    for(let d=1;d<=days;d++){const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const de=evs.filter(e=>e.data===ds).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
      cells+=`<div class="${ds===today()?'today':''}"><div class="dn" data-act="novoEvData" data-id="${ds}" title="Adicionar compromisso">${d}</div>${de.map(e=>`<span class="ce ${e.tipo==='Prazo'?'p-red':e.tipo==='Audiência'?'p-blue':e.tipo==='Perícia'?'p-teal':e.tipo==='Exigência INSS'?'p-amber':'p-gray'}" style="${e.feito?'opacity:.45;text-decoration:line-through':''}" data-act="editEv" data-id="${e.id}" title="${esc(e.titulo)}">${e.hora?esc(e.hora)+' ':''}${esc(e.titulo)}</span>`).join('')}</div>`;}
    const tail=(7-(start+days)%7)%7;for(let i=0;i<tail;i++)cells+='<div class="out"></div>';
    return head+`<div class="card"><h3><span><button class="btn btn-ghost btn-sm" data-act="agMes" data-id="-1">‹</button> ${first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})} <button class="btn btn-ghost btn-sm" data-act="agMes" data-id="1">›</button></span><small>Clique no número do dia para adicionar</small></h3><div class="cal">${cells}</div></div>`;
  }
  if(!f.feitos)evs=evs.filter(e=>!e.feito);
  evs.sort((a,b)=>(a.data+(a.hora||'')).localeCompare(b.data+(b.hora||'')));
  const venc=evs.filter(e=>!e.feito&&diff(e.data)<0);const rest=evs.filter(e=>e.feito||diff(e.data)>=0);
  const groups={};rest.forEach(e=>(groups[e.data]=groups[e.data]||[]).push(e));
  return head+`<div class="hint">Prazos processuais devem ser conferidos na publicação/intimação. Integração futura: captura automática de publicações (DJe) e andamentos dos tribunais.</div>

};

function preencherModelo(key,cid,pid,valor){
  const c=cli(cid)||{},p=proc(pid),e=db.escritorio;
  const advs=db.usuarios.filter(u=>u.oab).map(u=>u.nome+' ('+u.oab+')').join(', ')||'[advogados]';
  const map={cliente:c.nome||'[cliente]',tipodoc:c.tipo==='PJ'?'CNPJ':'CPF',doc:c.doc||'[documento]',cidade:c.cidade||'[endereço]',email:c.email||'[e-mail]',tel:c.tel||'[telefone]',
    escritorio:e.nome,advogados:advs,endereco_esc:e.endereco||'[endereço do escritório]',cidade_esc:(e.cidade||'[cidade]').split('/')[0],cnpj_esc:e.cnpj?', CNPJ '+e.cnpj:'',
    objeto:p?`${p.objeto} (${p.area}${p.numero?' — '+p.numero:''})`:'[descrever o objeto]',valor:valor?brl(valor)+' ('+valor.toLocaleString('pt-BR')+' reais)':'R$ [valor]',
    data:new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})};
  return MODELOS[key].txt.replace(/\{\{(\w+)\}\}/g,(_,k)=>map[k]??'');
}

V.financeiro=()=>{

  const dMes=L.filter(l=>l.tipo==='despesa'&&l.pago&&(l.pagoEm||l.venc).startsWith(ym)).reduce((s,l)=>s+l.valor,0);

    ${kpi('Recebido no mês',brl(rMes),'',`good`)}
    ${kpi('Pago no mês',brl(dMes))}

V.relatorios=()=>{
  const y=String(new Date().getFullYear());
  const pagos=db.lancamentos.filter(l=>l.pago&&(l.pagoEm||l.venc).startsWith(y));
  const sum=(arr,key)=>{const o={};arr.forEach(l=>o[key(l)]=(o[key(l)]||0)+l.valor);return Object.entries(o).sort((a,b)=>b[1]-a[1]);};
  const recCat=sum(pagos.filter(l=>l.tipo==='receita'),l=>l.categoria),despCat=sum(pagos.filter(l=>l.tipo==='despesa'),l=>l.categoria);
  const tR=recCat.reduce((s,x)=>s+x[1],0),tD=despCat.reduce((s,x)=>s+x[1],0);
  const recArea=sum(pagos.filter(l=>l.tipo==='receita'),areaLanc);
  const pArea={};db.processos.filter(p=>p.status==='Em andamento').forEach(p=>pArea[p.area]=(pArea[p.area]||0)+1);
  const resultados={};db.processos.filter(p=>p.status!=='Em andamento').forEach(p=>resultados[p.status]=(resultados[p.status]||0)+1);
  const origem={};db.clientes.forEach(c=>origem[c.origem||'—']=(origem[c.origem||'—']||0)+1);
  const prod=db.usuarios.map(u=>({u,proc:db.processos.filter(p=>p.responsavelId===u.id&&p.status==='Em andamento').length,
    tdone:db.tarefas.filter(t=>t.responsavelId===u.id&&t.status==='done').length,topen:db.tarefas.filter(t=>t.responsavelId===u.id&&t.status!=='done').length,
    ev:db.eventos.filter(e=>e.responsavelId===u.id&&!e.feito).length,venc:db.eventos.filter(e=>e.responsavelId===u.id&&!e.feito&&diff(e.data)<0).length}));
  const ticket=db.clientes.length?tR/Math.max(1,new Set(pagos.filter(l=>l.tipo==='receita'&&l.clienteId).map(l=>l.clienteId)).size):0;
  return `<div class="grid g-kpi">${kpi('Receita '+y,brl(tR))}${kpi('Despesa '+y,brl(tD))}${kpi('Resultado '+y,brl(tR-tD),tR?'margem '+Math.round((tR-tD)/tR*100)+'%':'',tR-tD>=0?'good':'bad')}${kpi('Ticket médio por cliente',brl(ticket))}</div>
  <div class="grid g-2">
    <div class="card"><h3>DRE simplificado ${y} <small>regime de caixa</small></h3><div class="tbl"><table><tbody>
      <tr><td class="strong">Receitas</td><td class="num strong" style="color:var(--green)">${brl(tR)}</td></tr>${recCat.map(([k,v])=>`<tr><td class="small" style="padding-left:22px">${esc(k)}</td><td class="num small">${brl(v)}</td></tr>`).join('')}
      <tr><td class="strong">Despesas</td><td class="num strong" style="color:var(--red)">− ${brl(tD)}</td></tr>${despCat.map(([k,v])=>`<tr><td class="small" style="padding-left:22px">${esc(k)}</td><td class="num small">${brl(v)}</td></tr>`).join('')}
      <tr><td class="strong">Resultado</td><td class="num strong" style="color:${tR-tD>=0?'var(--green)':'var(--red)'}">${brl(tR-tD)}</td></tr></tbody></table></div></div>
    <div class="card"><h3>Receita por área do direito <small>${y}</small></h3>${hbars(recArea,brlK)}
      <h3 style="margin-top:18px">Processos em andamento por área</h3>${hbars(Object.entries(pArea).sort((a,b)=>b[1]-a[1]),null)}
      <h3 style="margin-top:18px">Processos encerrados — resultado</h3>${hbars(Object.entries(resultados).map(([k,v])=>[k,v,k==='Ganho'||k==='Acordo'?'var(--green)':k==='Perdido'?'var(--red)':'var(--gray)']))}</div>
    <div class="card"><h3>Produtividade da equipe</h3><div class="tbl"><table><thead><tr><th>Membro</th><th class="num">Processos</th><th class="num">Tarefas feitas</th><th class="num">Tarefas abertas</th><th class="num">Prazos pend.</th></tr></thead><tbody>
      ${prod.map(r=>`<tr><td>${esc(r.u.nome)}<div class="small muted">${esc(r.u.papel)}</div></td><td class="num">${r.proc}</td><td class="num">${r.tdone}</td><td class="num">${r.topen}</td><td class="num">${r.ev}${r.venc?` <span class="pill p-red">${r.venc} venc.</span>`:''}</td></tr>`).join('')}</tbody></table></div></div>

function render(){
  const [page,id]=(location.hash.slice(1)||'painel').split('/');
  ui.page=V[page]?page:'painel';ui.id=id||null;
  let title=TITLES[ui.page];
  if(ui.page==='cliente'&&cli(ui.id))title=cli(ui.id).nome;
  if(ui.page==='processo'&&proc(ui.id))title='Processo '+proc(ui.id).numero;
  $('#ptitle').textContent=title;document.title=title+' · Gestão do Escritório';
  $('#view').innerHTML=V[ui.page]();
  const g=$('#cli-grid');if(g&&innerWidth<860)g.style.gridTemplateColumns='minmax(0,1fr)';
  const navKey={cliente:'clientes',processo:'processos'}[ui.page]||ui.page;
  document.querySelectorAll('.ni').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+navKey));
  badges();userBox();
}
function badges(){
  const n=(id,v)=>{$('#'+id).textContent=v||'';};
  n('nb-agenda',db.eventos.filter(e=>!e.feito&&diff(e.data)<=0).length);
  n('nb-tarefas',db.tarefas.filter(t=>t.status!=='done'&&t.prazo&&diff(t.prazo)<0).length);
  n('nb-fin',db.lancamentos.filter(l=>l.tipo==='receita'&&lancStatus(l)==='Atrasado').length);
  n('nb-docs',db.documentos.filter(d=>!d.recebido).length);
  $('#brand-nome').textContent=(db.escritorio.nome||'Escritório').replace(/\s+Advocacia$/i,'');
}
function userBox(){
  $('#u-sel').innerHTML=db.usuarios.map(u=>`<option value="${u.id}"${u.id===db.usuarioAtual?' selected':''}>${esc(u.nome)}</option>`).join('');

  copiarModelo:()=>{const t=$('#modelo-txt');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Copiado ✓')).catch(()=>{document.execCommand('copy');toast('Copiado ✓');});},
  baixarModelo:()=>{const t=$('#modelo-txt').value;const f=ui.f.doc;const html=`<html><head><meta charset="utf-8"></head><body style="font-family:'Times New Roman';font-size:12pt;line-height:1.5">${esc(t).replace(/\n/g,'<br>')}</body></html>`;
    download(MODELOS[f.modelo].nome.replace(/\s+/g,'_')+(f.mcli?'_'+nomeCli(f.mcli).split(' ')[0]:'')+'.doc','﻿'+html,'application/msword');},
  kmove:k=>{const[kind,id,col]=k.split(':');moveCard(kind,id,col);},
  agView:v=>{ui.agendaView=v;render();},
  agMes:d=>{ui.agendaMes=addMonths(ui.agendaMes+'-01',+d).slice(0,7);render();},
  salvarEsc:()=>{['nome','cnpj','oab','email','tel','cidade','endereco'].forEach(k=>db.escritorio[k]=$('#esc_'+k).value.trim());save();render();toast('Dados do escritório salvos ✓');},
  novoUsr:()=>editUsuario(),editUsr:id=>editUsuario(id),
  exportar:()=>download('backup-escritorio-'+today()+'.json',JSON.stringify(db,null,1),'application/json'),
  importar:()=>$('#file-import').click(),
  resetDemo:()=>{if(confirm('Substituir todos os dados atuais pelos dados de exemplo?')){db=seed();save();location.hash='painel';render();toast('Dados de exemplo restaurados');}},
  zerar:()=>{if(confirm('Apagar TODOS os dados? Recomenda-se exportar um backup antes.')){const e=db.escritorio,u=db.usuarios;db={versao:4,escritorio:e,usuarioAtual:u[0].id,usuarios:u,clientes:[],processos:[],eventos:[],tarefas:[],leads:[],lancamentos:[],documentos:[],notas:[]};save();location.hash='painel';render();toast('Sistema zerado');}},
};
document.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-act]');
  if(a&&A[a.dataset.act]){if(a.tagName!=='INPUT')ev.preventDefault();ev.stopPropagation();if(a.closest('#m-body')&&$('#mbg').classList.contains('open')&&a.closest('.qa'))closeModal();A[a.dataset.act](a.dataset.id,a);return;}
  const g=ev.target.closest('[data-go]');if(g&&!ev.target.closest('a,button,input')){location.hash=g.dataset.go;return;}
  if(ev.target.id==='mbg')closeModal();
  if(!ev.target.closest('.search'))$('#sres').classList.remove('open');
  if(ev.target.closest('.ni')||ev.target.id==='scrim'){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');}
});
/* filtros: data-f="grupo.campo" */
function onFilter(el){const[g,k]=el.dataset.f.split('.');ui.f[g]=ui.f[g]||{};ui.f[g][k]=el.type==='checkbox'?el.checked:el.value;
  if(g==='doc'&&k==='mcli')ui.f.doc.mproc=db.processos.find(p=>p.clienteId===el.value)?.id||'';}
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.f&&el.tagName!=='INPUT'||el.dataset.f&&['checkbox','month','number'].includes(el.type)){onFilter(el);render();}});
let fTimer;
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.f&&el.tagName==='INPUT'&&!['checkbox','month'].includes(el.type)){onFilter(el);clearTimeout(fTimer);fTimer=setTimeout(()=>{const pos=el.selectionStart,sel='[data-f="'+el.dataset.f+'"]';render();const n=$(sel);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}},250);}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();if(ev.key==='Enter'&&ev.target.id==='and-txt')A.addAnd(ui.id);});
/* drag & drop dos kanbans */
let dragKey=null;
document.addEventListener('dragstart',ev=>{const c=ev.target.closest&&ev.target.closest('[data-drag]');if(c){dragKey=c.dataset.drag;ev.dataTransfer.setData('text/plain',dragKey);ev.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',ev=>{const col=ev.target.closest('[data-drop]');if(col&&dragKey&&col.dataset.drop.split(':')[0]===dragKey.split(':')[0]){ev.preventDefault();document.querySelectorAll('.kcol.over').forEach(c=>c!==col&&c.classList.remove('over'));col.classList.add('over');}});
document.addEventListener('dragleave',ev=>{const col=ev.target.closest('[data-drop]');if(col&&!col.contains(ev.relatedTarget))col.classList.remove('over');});
document.addEventListener('drop',ev=>{const col=ev.target.closest('[data-drop]');if(col&&dragKey){ev.preventDefault();const[kind,id]=dragKey.split(':');const target=col.dataset.drop.slice(kind.length+1);dragKey=null;moveCard(kind,id,target);}});
document.addEventListener('dragend',()=>{dragKey=null;document.querySelectorAll('.kcol.over').forEach(c=>c.classList.remove('over'));});
/* busca global */
$('#q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase(),box=$('#sres');if(q.length<2){box.classList.remove('open');return;}
  const dq=digits(q);
  const cs=db.clientes.filter(c=>c.nome.toLowerCase().includes(q)||(dq.length>=3&&digits(c.doc).includes(dq))).slice(0,6);
  const ps=db.processos.filter(p=>(p.numero+' '+p.objeto+' '+p.parteContraria).toLowerCase().includes(q)||(dq.length>=3&&digits(p.numero).includes(dq))).slice(0,6);
  box.innerHTML=cs.map(c=>`<a href="#cliente/${c.id}">${esc(c.nome)}<small>Cliente · ${esc(c.doc)}</small></a>`).join('')+ps.map(p=>`<a href="#processo/${p.id}">${esc(p.numero)}<small>Processo · ${esc(nomeCli(p.clienteId))} · ${esc(p.objeto)}</small></a>`).join('')||'<div class="empty">Nada encontrado</div>';
  box.classList.add('open');
});
$('#sres').addEventListener('click',e=>{if(e.target.closest('a')){$('#sres').classList.remove('open');$('#q').value='';}});
$('#u-sel').addEventListener('change',e=>{db.usuarioAtual=e.target.value;save();render();});
$('#menu-btn').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('open');});
$('#file-import').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.clientes)||!Array.isArray(d.lancamentos))throw 0;
  if(confirm('Substituir os dados atuais pelo backup?')){db=d;save();location.hash='painel';render();toast('Backup importado ✓');}}catch(err){toast('Arquivo de backup inválido',1);}e.target.value='';};r.readAsText(f);});
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0);});
window.addEventListener('resize',()=>{const g=$('#cli-grid');if(g)g.style.gridTemplateColumns=innerWidth<860?'minmax(0,1fr)':'minmax(0,320px) minmax(0,1fr)';});

load();render();
</script>
</body>
</html>
